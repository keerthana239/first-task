<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trainee Start</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!--Navbar -->
  <nav class="navbar">
    <div class="logo">Logo</div>
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>
  <!--main-->
  <div class="main">
    <div class="main-text">Trainee <br> Start</div>
    <img src="img1.png" alt="Illustration">
  </div>
  <!-- Main container -->
  <div class="container">
    <!-- Left column-->
    <div class="left">
      <div class="card profile">
        <img src="img2.png" alt="Avatar">
        <div>
          <strong>John Doe</strong><br>
          <span>Trainee</span>
        </div>
      </div>
      <div class="card">
        <h3>Upload Image</h3>
        <div class="upload-box">Drag and drop or select image to upload</div>
        <button>Upload</button>
      </div>
    </div>
    <!-- Right column -->
    <div class="right">
      <div class="card tasks">
        <h3>Tasks</h3>
        <ul>
          <li><input type="checkbox" checked> Complete onboarding</li>
          <li><input type="checkbox" checked> Read company policies</li>
          <li><input type="checkbox"> Set up development environment</li>
          <li><input type="checkbox"> Meet the team</li>
        </ul>
        <button>Add Task</button>
      </div> 
      <div class="card notes">
        <h3>Notes</h3>
        <textarea placeholder="Write notes..."></textarea>
        <button>Save Notes</button>
      </div>
    </div>
  </div>
</body>
</html>
