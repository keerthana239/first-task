<body>


  <!-- Login Card -->
  <div class="card p-4 login-card">
    <h4 class="text-center mb-3 text-primary">Login to Thoughts Blog</h4>
    <div id="errorMsg" class="text-danger text-center mb-2"></div>


<form action="captcha.php" method="POST"></form>

    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" id="username" class="form-control" required placeholder="Enter username">
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-control" required placeholder="Enter password">
      </div>


      <input type="hidden" name="g-recaptcha-response" id="g-recaptcha-response">

      <!-- adding google recaptcha-->
        <!--<div class="g-recaptcha" data-sitekey="6LcDuvorAAAAADB0AsviHnYQ9iwFQbANYGzpcsqG"></div>-->


        

      <button type="submit" id="loginBtn"  class="btn btn-primary w-100 d-flex justify-content-center align-items-center">
        <span id="btnText">Login</span>
        <div class="spinner-border text-light ms-2" role="status" id="spinner"></div>
      </button>
    </form>

    <p class="mt-3 text-center">Don’t have an account? <a href="signup.html">Sign up</a></p>
  </div>






<script>
        grecaptcha.ready(function() {
            grecaptcha.execute('YOUR_SITE_KEY', {action: 'submit'}).then(function(token) {
                document.getElementById('g-recaptcha-response').value = token;
            });
        });
    </script>







  <script>
    // 🔹 If already logged in → redirect immediately
    const existingUser = JSON.parse(localStorage.getItem('loggedInUser'));
    if (existingUser) {
      window.location.href = 'thoughts.html';
    }

    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const spinner = document.getElementById('spinner');
    const btnText = document.getElementById('btnText');
    const loginBtn = document.getElementById('loginBtn');

    // 🔹 Submit handler
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.textContent = '';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      // Show spinner
      spinner.style.display = 'inline-block';
      btnText.textContent = 'Logging in...';
      loginBtn.disabled = true;

      try {
        const res = await fetch('https://dummyjson.com/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (res.ok) {
          // Save login info
          localStorage.setItem('loggedInUser', JSON.stringify(data));
          const redirect = localStorage.getItem('redirectAfterLogin') || 'thoughts.html';
          localStorage.removeItem('redirectAfterLogin');
          window.location.href = redirect;
        } else {
          errorMsg.textContent = data.message || 'Invalid username or password.';
        }
      } catch (err) {
        errorMsg.textContent = 'Something went wrong. Please try again.';
      } finally {
        // Hide spinner
        spinner.style.display = 'none';
        btnText.textContent = 'Login';
        loginBtn.disabled = false;
      }
    });
  </script>
