<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>🧠 Thought Detail</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #fafafa; }
    .comment-item {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      background: #fff;
    }
    .spinner-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 200px;
    }
  </style>
</head>
<body>
  <!-- 🌐 Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary">
        <img src="Screenshot 2025-10-10 145839.png" alt="Logo" style="width:40px;" class="rounded-pill me-2">
        Thoughts Blog
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="thoughts.html">Thoughts</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        </ul>
      </div>
      <div class="d-flex ms-lg-3 mt-2 mt-lg-0">
        <button class="btn btn-outline-primary me-2" data-bs-toggle="modal" data-bs-target="#loginModal">Login</button>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#signupModal">Signup</button>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <span class="text-primary mb-3 d-block" style="cursor:pointer;" onclick="window.history.back()">← Back to thoughts</span>

    <!-- 🔹 Thought detail with spinner -->
    <div id="detail-section" class="text-center mb-4 shadow-sm p-4 bg-white rounded">
      <div id="detail-spinner" class="spinner-container">
        <div class="spinner-border text-primary" role="status"></div>
      </div>
    </div>

    <h4>💬 Comments</h4>
    <div id="comment-section" class="mt-3"></div>

    <!-- ✍️ Add new comment -->
    <div class="card mt-4 shadow-sm p-3">
      <h5>Add a Comment</h5>
      <form id="commentForm">
        <div class="mb-3">
          <input type="text" id="commentName" class="form-control" placeholder="Your Name" required>
        </div>
        <div class="mb-3">
          <input type="email" id="commentEmail" class="form-control" placeholder="Your Email" required>
        </div>
        <div class="mb-3">
          <textarea id="commentBody" class="form-control" placeholder="Your Comment" rows="3" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary w-100">Post Comment</button>
      </form>
    </div>
  </div>

  <footer class="bg-white text-center py-3 mt-5 shadow-sm">© 2025 Thoughts Blog ❤️🧿</footer>
  <!-- Login & Signup Modals -->
<div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold" id="loginModalLabel">Login</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label">Email address</label>
            <input type="email" class="form-control" id="loginEmail" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" id="loginPassword" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="signupModal" tabindex="-1" aria-labelledby="signupModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold" id="signupModalLabel">Signup</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="signupForm">
          <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" id="signupName" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" id="signupEmail" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" id="signupPassword" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Create Account</button>
        </form>
      </div>
    </div>
  </div>
</div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    const detailSection = document.getElementById("detail-section");
    const detailSpinner = document.getElementById("detail-spinner");
    const commentSection = document.getElementById("comment-section");
    const commentForm = document.getElementById("commentForm");

    let commentsData = [];

    // 🧠 Load thought details
    fetch(`https://jsonplaceholder.typicode.com/posts/${id}`)
      .then(res => res.json())
      .then(thought => {
        const randomImage = `https://picsum.photos/600/250?random=${thought.id}`;
        detailSection.innerHTML = `
          <div class="spinner-container">
            <div class="spinner-border text-secondary" role="status"></div>
          </div>
          <img src="${randomImage}" class="img-fluid d-none mb-3 rounded" alt="Thought image" 
            onload="this.previousElementSibling.remove(); this.classList.remove('d-none');">
          <h3 class="text-capitalize mb-3">${thought.title}</h3>
          <p>${thought.body}</p>
          
        `;
      });

    // 💬 Load comments
    fetch(`https://jsonplaceholder.typicode.com/comments?postId=${id}`)
      .then(res => res.json())
      .then(comments => {
        commentsData = comments;
        renderComments();
      });

    // 📝 Add comment
    commentForm.addEventListener("submit", e => {
      e.preventDefault();
      const newComment = {
        name: document.getElementById("commentName").value,
        email: document.getElementById("commentEmail").value,
        body: document.getElementById("commentBody").value
      };
      commentsData.unshift(newComment);
      renderComments();
      commentForm.reset();
    });

    function renderComments() {
      commentSection.innerHTML = "";
      commentsData.forEach(comment => {
        commentSection.innerHTML += `
          <div class="comment-item">
            <h6>${comment.name} <small class="text-muted">(${comment.email})</small></h6>
            <p>${comment.body}</p>
          </div>
        `;
      });
    }
    document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  alert('Login successful (demo only)');
  const modal = bootstrap.Modal.getInstance(document.getElementById('loginModal'));
  modal.hide();
});

document.getElementById('signupForm').addEventListener('submit', function(e){
  e.preventDefault();
  alert('Account created successfully (demo only)');
    const modal = bootstrap.Modal.getInstance(document.getElementById('signupModal'));
  modal.hide();
});
  </script>
</body>
</html>
