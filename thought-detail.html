<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>🧠 Thought Detail</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="prostyle.css" rel="stylesheet">
  
  <style>
    body { background-color: #fafafa; }
    .comment-item {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      background: #fff;
    }
    .comment-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .comment-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      flex: 0 0 48px;
      object-fit: cover;
    }
    .comment-body {
      flex: 1 1 auto;
    }
    .spinner-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 200px;
    }
  </style>
</head>
<body>
  <!-- 🌐 Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="index.html">
        <img src="logo.jpg" alt="Logo" style="width:40px;" class="rounded-pill me-2">
        Thoughts Blog
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="thoughts.html">Thoughts</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>

          <button class="btn-theme-toggle theme-toggle" onclick="themeController.toggleTheme()">
    🔆
</button>
        </ul>
      </div>
      <div id="navActions" class="d-flex ms-3"></div>
    </div>
  </nav>

  <div class="container mt-4">
    <span class="text-primary mb-3 d-block" style="cursor:pointer;" onclick="window.history.back()">← Back to thoughts</span>

    <!-- 🔹 Thought detail with spinner -->
    <div id="detail-section" class="text-center mb-4 shadow-sm p-4 bg-white rounded">
      <div id="detail-spinner" class="spinner-container">
        <div class="spinner-border text-primary" role="status"></div>
      </div>
    </div>

    <h4>💬 Comments</h4>
    <div id="comment-section" class="mt-3"></div>

    <!-- ✍️ Add new comment -->
    <div class="card mt-4 shadow-sm p-3">
      <h5>Add a Comment</h5>
      <form id="commentForm">
        <div class="mb-3">
          <input type="text" id="commentName" class="form-control" placeholder="Your Name" required>
        </div>
        <div class="mb-3">
          <input type="email" id="commentEmail" class="form-control" placeholder="Your Email" required>
        </div>
        <div class="mb-3">
          <textarea id="commentBody" class="form-control" placeholder="Your Comment" rows="3" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary w-100">Post Comment</button>
      </form>
    </div>
  </div>

  <footer class="bg-white text-center py-3 mt-5 shadow-sm">© 2025 Thoughts Blog ❤️🧿</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="constants.js"></script>
  <script src="functions.js"></script>
<script src="profile.js"></script>
  <script>
    // Check if user is logged in, redirect to login if not
    const user = JSON.parse(localStorage.getItem("loggedInUser"));
    if (!user) {
      localStorage.setItem("redirectAfterLogin", window.location.href);
      window.location.href = "login.html";
    }

    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    const detailSection = document.getElementById("detail-section");
    const commentSection = document.getElementById("comment-section");
    const commentForm = document.getElementById("commentForm");
    const navActions = document.getElementById("navActions");

    let commentsData = [];
   
  
// 🧠 Load thought details
fetch(`https://jsonplaceholder.typicode.com/posts/${id}`)
  .then(res => {
    if (!res.ok) throw new Error('Post not found');
    return res.json();
  })
  .then(thought => {
    if (!thought || !thought.id) throw new Error('Post not found');
    const randomImage = `https://picsum.photos/600/250?random=${thought.id}`;
    detailSection.innerHTML = `
      <div class="spinner-container">
        <div class="spinner-border text-secondary" role="status"></div>
      </div>
      <img src="${randomImage}" class="img-fluid d-none mb-3 rounded" alt="Thought image" 
        onload="this.previousElementSibling.remove(); this.classList.remove('d-none');">
      <h3 class="text-capitalize mb-3">${thought.title}</h3>
      <p>${thought.body}</p>
    `;
  })
  .catch(() => {
    detailSection.innerHTML = `<div class='alert alert-danger'>Post not found.</div>`;
    document.getElementById('comment-section').style.display = 'none';
    document.getElementById('commentForm').parentElement.style.display = 'none';
    document.querySelector('h4').style.display = 'none';
  });

 
    // 💬 Load comments
    fetch(`https://jsonplaceholder.typicode.com/comments?postId=${id}`)
      .then(res => res.json())
      .then(comments => {
        commentsData = comments;
        renderComments();
      });

    // ➕ Add comment
    commentForm.addEventListener("submit", e => {
      e.preventDefault();
      const newComment = {
        name: document.getElementById("commentName").value,
        email: document.getElementById("commentEmail").value,
        body: document.getElementById("commentBody").value
      };
      commentsData.unshift(newComment);
      renderComments();
      commentForm.reset();
    });

    // 🧩 Render all comments
    function renderComments() {
      commentSection.innerHTML = "";
      commentsData.forEach(comment => {
        const avatarUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(comment.email || 'U')}&background=0D6EFD&color=fff&rounded=true&size=128`;
        commentSection.innerHTML += `
          <div class="comment-item">
            <div class="comment-row">
              <img class="comment-avatar" src="${avatarUrl}" alt="avatar">
              <div class="comment-body">
                <h6 class="mb-1">${comment.name} <small class="text-muted">(${comment.email})</small></h6>
                <p class="mb-0">${comment.body}</p>
              </div>
            </div>
          </div>
        `;
      });
    }

    function openDetail(id) {
  const user = JSON.parse(localStorage.getItem("loggedInUser"));
  if (user) {
    window.location.href = `thought-detail.html?id=${id}`;
  } else {
    localStorage.setItem("redirectAfterLogin", `thought-detail.html?id=${id}`);
    window.location.href = "login.html";
  }
}

  </script>



 <script src="profile.js"></script>
  <script src="profile.html"></script>


<!-- Call the function -->
<script>
  updateNavbar();
</script>

        <div id="profileSpinner" class="spinner-border text-primary mb-3"></div>
        <div id="userDetails" class="user-details d-none"></div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
