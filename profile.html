<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>👤 User Profile</title>
  <link rel="icon" type="image/png" href="seo.png">
   <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="prostyle.css">
  <style>
    body { background-color: #000000; }
    .profile-container {
      max-width: 800px;
      margin-top: 60px;
      background: #fff;
      padding: 2rem;
      border-radius: 15px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    .profile-avatar {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid #04080e;
}
    .user-info-item {
      display: flex;
      justify-content: space-between;
      padding: 0.5rem 0;
      border-bottom: 1px solid #eee;
    }
    .user-info-label {
      font-weight: 600;
      color: #495057;
    }

</style>
    
</head>
<body onload="loadUserProfile()">

  <!-- 🔹 Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top px-3">
    <a class="navbar-brand fw-bold text-primary" href="thoughts.html">💭 Thoughts</a>
    <div class="ms-auto" id="navActions"></div>
  </nav>

  <!-- 🔹 Profile Section -->
  <div class="container profile-container bg-dark text-light">
    <div id="profileSpinner" class="text-center my-5">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="mt-2">Loading profile...</p>
    </div>

    <div id="userDetails" class="d-none">
      <div class="text-center mb-4">
        <img id="userAvatar" class="profile-avatar mb-3" alt="User Avatar">
        <h4 id="userName" class="fw-bold mb-0"></h4>
        <p id="userEmail" class="text-secondary"></p>
      </div>

      <!-- 🔸 Tabs -->
      <ul class="nav nav-tabs justify-content-center mb-4" id="profileTabs" role="tablist">
        <li class="nav-item"><button class="nav-link active" id="basic-tab" data-bs-toggle="tab" data-bs-target="#basic" type="button">Basic Info</button></li>
        <li class="nav-item"><button class="nav-link" id="contact-tab" data-bs-toggle="tab" data-bs-target="#contact" type="button">Contact</button></li>
        <li class="nav-item"><button class="nav-link" id="company-tab" data-bs-toggle="tab" data-bs-target="#company" type="button">Company</button></li>
        <li class="nav-item"><button class="nav-link" id="other-tab" data-bs-toggle="tab" data-bs-target="#bank" type="button">Bank</button></li>
        <li class="nav-item"><button class="nav-link" id="crypto-tab" data-bs-toggle="tab" data-bs-target="#crypto" type="button">Crypto</button></li>
      </ul>

      <!-- 🔸 Tab Content -->
      <div class="tab-content">
        <div class="tab-pane fade show active" id="basic">
          <div class="user-info-item"><span class="user-info-label">Full Name</span><span id="fullName"></span></div>
          <div class="user-info-item"><span class="user-info-label">Gender</span><span id="gender"></span></div>
          <div class="user-info-item"><span class="user-info-label">Age</span><span id="age"></span></div>
          <div class="user-info-item"><span class="user-info-label">Birth Date</span><span id="birthDate"></span></div>
          <div class="user-info-item"><span class="user-info-label">Blood Group</span><span id="bloodGroup"></span></div>
          <div class="user-info-item"><span class="user-info-label">Height</span><span id="height"></span></div>
          <div class="user-info-item"><span class="user-info-label">Weight</span><span id="weight"></span></div>
        </div>

        <div class="tab-pane fade" id="contact">
          <div class="user-info-item"><span class="user-info-label">Phone</span><span id="phone"></span></div>
          <div class="user-info-item"><span class="user-info-label">Email</span><span id="email"></span></div>
          <div class="user-info-item"><span class="user-info-label">Address</span><span id="address"></span></div>
        </div>

        <div class="tab-pane fade" id="company">
          <div class="user-info-item"><span class="user-info-label">Company Name</span><span id="companyName"></span></div>
          <div class="user-info-item"><span class="user-info-label">Department</span><span id="department"></span></div>
        </div>


     <div class="tab-pane fade" id="bank">
  <div class="user-info-item"><span class="user-info-label">Card Number</span><span id="cardNumber"></span></div>
  <div class="user-info-item"><span class="user-info-label">Card Type</span><span id="cardType"></span></div>
  <div class="user-info-item"><span class="user-info-label">Currency</span><span id="currency"></span></div>
  <div class="user-info-item"><span class="user-info-label">IBAN</span><span id="iban"></span></div>
</div>

    <div class="tab-pane fade" id="crypto">
      <div class="user-info-item"><span class="user-info-label">Coin</span><span id="coin"></span></div>
      <div class="user-info-item"><span class="user-info-label">Wallet</span><span id="wallet"></span></div>
    </div>

      <div class="text-center mt-4">
  <button class="btn btn-outline-danger" onclick="logout()">Logout</button>
</div>


  


  <!-- 🔹 Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="profile.js"></script>
  <script>
    function loadUserProfile() {
      updateNavbar();

      const spinner = document.getElementById('profileSpinner');
      const details = document.getElementById('userDetails');
      spinner.classList.remove('d-none');
      details.classList.add('d-none');

      fetch('https://dummyjson.com/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: 'emilys', password: 'emilyspass' })
      })
      .then(res => res.json())
      .then(loginData => {
        return fetch('https://dummyjson.com/users/1', {
          headers: { 'Authorization': `Bearer ${loginData.token}` }
        });
      })
      .then(res => res.json())
      .then(userData => {
        spinner.classList.add('d-none');
        details.classList.remove('d-none');

        // avatar fallback
        const avatarUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(userData.username)}&background=0D6EFD&color=fff`;
        document.getElementById('userAvatar').src = userData.image || avatarUrl;
        document.getElementById('userName').innerText = `${userData.firstName} ${userData.lastName}`;
        document.getElementById('userEmail').innerText = userData.email;

        // Basic Info
        document.getElementById('fullName').innerText = `${userData.firstName} ${userData.lastName}`;
        document.getElementById('gender').innerText = userData.gender;
        document.getElementById('age').innerText = userData.age;
        document.getElementById('birthDate').innerText = userData.birthDate;
        document.getElementById('bloodGroup').innerText = userData.bloodGroup;
        document.getElementById('height').innerText = `${userData.height} cm`;
        document.getElementById('weight').innerText = `${userData.weight} kg`;

        // Contact
        document.getElementById('phone').innerText = userData.phone;
        document.getElementById('email').innerText = userData.email;
        document.getElementById('address').innerText = `${userData.address.address}, ${userData.address.city}`;

        // Company
        document.getElementById('companyName').innerText = userData.company.name;
        document.getElementById('department').innerText = userData.company.department;

        // bank
        document.getElementById('cardNumber').innerText = userData.bank.cardNumber;
        document.getElementById('cardType').innerText = userData.bank.cardType;
        document.getElementById('currency').innerText = userData.bank.currency;
        document.getElementById('iban').innerText = userData.bank.iban;



        //crypto
        document.getElementById('coin').innerText = userData.crypto.coin;
        document.getElementById('wallet').innerText = userData.crypto.wallet;
        
      })
      .catch(() => {
        spinner.classList.add('d-none');
        details.classList.remove('d-none');
        details.innerHTML = `<div class="alert alert-danger">Failed to load profile. Please try again later.</div>`;
      });
    }

    function logout() {
      localStorage.removeItem("loggedInUser");
      window.location.href = "login.html";
    }
  </script>
  
</body>
</html>
