<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
  <title> Thoughts Blog</title>
  <link rel="icon" type="image/png" href="seo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="prostyle.css" rel="stylesheet">
<style>
  

</style>
</head>
<body>

 

  
 <!-- 🌐 Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
  <div class="container-fluid"> <!-- ✅ use container-fluid for full width -->

    <!-- Brand -->
    <a class="navbar-brand fw-bold text-primary" href="thoughts.html">
      <img src="logo.jpg" alt="Logo" style="width:40px;" class="rounded-pill me-2">
      Thoughts Blog
    </a>

    <!-- 🟡 Right Section (Theme + Actions + Toggler) -->
    <div class="d-flex align-items-center ms-auto">
      <button class="btn-theme-toggle theme-toggle me-2" onclick="themeController.toggleTheme()">
        🔆
      </button>

      <div id="navActions" class="d-flex align-items-center me-2"></div>

      <!-- Navbar toggler always at far right -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
    </div>

    <!-- Collapsible links -->
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link active" href="thoughts.html">Thoughts</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
      </ul>
    </div>

  </div>
</nav>

  <div class="container py-5">
    <h2 class="text-center text-primary fw-bold mb-4">Contact Us 📬</h2>
    <p class="text-center text-primary mb-4">We’d love to hear from you! Reach out using the form below.</p>

    <form class="mx-auto" style="max-width:500px;">
      <div class="mb-3">
        <label class="form-label">Your Name</label>
        <input type="text" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Message</label>
        <textarea class="form-control" rows="4" required></textarea>
      </div>
      <button class="btn btn-primary w-100">Send Message</button>
    </form>
  </div>

   <footer class="bg-white  py-3 mt-5 shadow-sm-9  border border-dark text-center">© 2025 Thoughts Blog ❤️🧿</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="profile.html"></script>
  <script src="profile.js"></script>

<!-- Call the function -->
<script>
  updateNavbar();
</script>
<div class="modal fade" id="userProfileModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Profile Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body text-center">
        <div id="profileSpinner" class="spinner-border text-primary mb-3"></div>
        <div id="userDetails" class="user-details d-none"></div>
      </div>
    </div>
  </div>
</div>

<script src="js/theme-controller.js"></script>
<link rel="stylesheet" href="css/theme.css">
</body>
</html>
