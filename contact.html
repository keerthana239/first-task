<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title> Thoughts Blog</title>
  <link rel="icon" type="image/png" href="seo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="prostyle.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="thoughts.html">
        <img src="logo.jpg" alt="Logo" style="width:40px;" class="rounded-pill me-2">
        Thoughts Blog
      </a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="thoughts.html">Thoughts</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
        </ul>
      </div>
      <div id="navActions" class="d-flex ms-3"></div>
    </div>
  </nav>

  <div class="container py-5">
    <h2 class="text-center text-primary fw-bold mb-4">Contact Us 📬</h2>
    <p class="text-center text-secondary mb-4">We’d love to hear from you! Reach out using the form below.</p>

    <form class="mx-auto" style="max-width:500px;">
      <div class="mb-3">
        <label class="form-label">Your Name</label>
        <input type="text" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Message</label>
        <textarea class="form-control" rows="4" required></textarea>
      </div>
      <button class="btn btn-primary w-100">Send Message</button>
    </form>
  </div>

  <footer class="bg-white text-center py-3 shadow-sm mt-5">© 2025 Thoughts Blog ❤️🧿</footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="navbar.js"></script>
  <script src="profile.js"></script>

<!-- Call the function -->
<script>
  updateNavbar();
</script>
<div class="modal fade" id="userProfileModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Profile Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body text-center">
        <div id="profileSpinner" class="spinner-border text-primary mb-3"></div>
        <div id="userDetails" class="user-details d-none"></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
