<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>💭 Thoughts Blog | Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #fafafa; }
    .hero {
      text-align: center;
      padding: 100px 20px;
    }
  </style>
</head>
<body>
  <!-- 🌐 Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="index.html">
        <img src="logo.jpg" alt="Logo" style="width:40px;" class="rounded-pill me-2">
        Thoughts Blog
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a id="thoughtsLink" class="nav-link" href="#">Thoughts</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        </ul>
      </div>
      <div id="navActions" class="d-flex ms-3"></div>
    </div>
  </nav>

  <!-- 🌟 Hero Section -->
  <div class="hero">
    <h1 class="fw-bold text-primary">Welcome to Thoughts Blog 💭</h1>
    <p class="lead text-secondary">Share your daily thoughts, ideas, and inspirations.</p>
    <button id="exploreBtn" class="btn btn-primary btn-lg mt-3">Explore Thoughts</button>
  </div>

  <footer class="bg-white text-center py-3 mt-5 shadow-sm">© 2025 Thoughts Blog ❤️🧿</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const navActions = document.getElementById("navActions");

    function setupNavbar() {
      const user = JSON.parse(localStorage.getItem("loggedInUser"));
      if (user) {
        navActions.innerHTML = `
          <div class="dropdown">
            <button class="btn btn-outline-primary dropdown-toggle" type="button" data-bs-toggle="dropdown">
              👋 ${user.username}
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item text-danger" href="#" id="logoutBtn">Logout</a></li>
            </ul>
          </div>`;
        document.getElementById("logoutBtn").addEventListener("click", () => {
          localStorage.removeItem("loggedInUser");
          window.location.href = "index.html"; // ✅ Redirect to home
        });
      } else {
        navActions.innerHTML = `
          <button class="btn btn-outline-primary me-2" onclick="window.location.href='login.html'">Login</button>
          <button class="btn btn-primary" onclick="window.location.href='signup.html'">Signup</button>`;
      }
    }

    setupNavbar();

    // 🧠 Thought page link logic
    document.getElementById("thoughtsLink").addEventListener("click", (e) => {
      e.preventDefault();
      const user = JSON.parse(localStorage.getItem("loggedInUser"));
      if (user) {
        window.location.href = "thoughts.html";
      } else {
        localStorage.setItem("redirectAfterLogin", "thoughts.html");
        window.location.href = "login.html";
      }
    });
    // 🚀 Explore button does same
    document.getElementById("exploreBtn").addEventListener("click", () => {
      const user = JSON.parse(localStorage.getItem("loggedInUser"));
      if (user) {
        window.location.href = "thoughts.html";
      } else {
        localStorage.setItem("redirectAfterLogin", "thoughts.html");
        window.location.href = "login.html";
      }
    });
  </script>
</body>
</html>
