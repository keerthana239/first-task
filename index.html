<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>💭 Thoughts Blog | Home</title>
   <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="seo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #fafafa;}
    .hero { text-align:center; padding: 100px 20px;  background-color: lavender  ; height:100vh; width:100%;  }
    
  .footer {
position: fixed;
left: 0;
bottom: 0;
width: 100%;
background-color: rgb(248, 247, 248);
color: rgb(10, 12, 12);
text-align: center ;
} 

  </style>
</head>
<body>










 

   <!-- 🌐 Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
  <div class="container-fluid"> <!-- use container-fluid so it spans full width -->
    <a class="navbar-brand fw-bold text-primary" href="index.html">
      <img src="logo.jpg" alt="Logo" style="width:40px;" class="rounded-pill me-2">
      Thoughts Blog
    </a>

    <!-- 🟢 Move the toggler here and push it to the right -->
    <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a id="thoughtsLink" class="nav-link" href="index.html">Thoughts</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
      </ul>
      <div id="navActions" class="d-flex ms-3"></div>
    </div>
  </div>
</nav>


  <!-- 🌟 Hero Section -->
  <div class="hero">
   
    <h1 class="fw-bold text-primary">Welcome to Thoughts Blog 💭</h1>
    <p class="lead text-secondary">Share your daily thoughts, ideas, and inspirations.</p>
    <button id="exploreBtn" class="btn btn-primary btn-lg mt-3">Explore Thoughts</button>
  </div>


 <footer class="bg-white  py-3 mt-5 shadow-sm-9  border border-dark text-center fixed-bottom">© 2025 Thoughts Blog ❤️🧿</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Your functions.js -->
  <script src="functions.js"></script>

  <!-- Page-specific scripts -->
  <script>
    // Initialize navbar
    document.addEventListener("DOMContentLoaded", () => {
      updateNavbar("navActions");

      // Thoughts / Explore button logic
      const exploreBtn = document.getElementById("exploreBtn");
      exploreBtn.addEventListener("click", () => {
      const user = JSON.parse(localStorage.getItem("loggedInUser"));
      if (user) {
        window.location.href = "thoughts.html";
      } else {
        localStorage.setItem("redirectAfterLogin", "thoughts.html");
        window.location.href = "login.html";
      }
    });



      //This code ensures the navbar “Thoughts” link behaves like the Explore button:
//Logged-in users go directly to thoughts.html.
//Not-logged-in users are sent to login, then back to thoughts.html after login.
//e.preventDefault() is crucial to override default anchor navigation.

      const thoughtsLink = document.getElementById("thoughtsLink");
      thoughtsLink.addEventListener("click", (e) => {
        e.preventDefault();
      const user = JSON.parse(localStorage.getItem("loggedInUser"));
      if (user) {
        window.location.href = "thoughts.html";
      } else {
        localStorage.setItem("redirectAfterLogin", "thoughts.html");
        window.location.href = "login.html";
      }
      });
    });
  </script>



</body>
</html>
