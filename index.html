<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>💭 Thoughts Blog | Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #fafafa;}
    .hero { text-align: center; padding: 100px 20px;  background-color: lavender  ;}
    .profile-avatar { width: 35px; height: 35px; border-radius: 50%; cursor: pointer; }
  .footer {
position: fixed;
left: 0;
bottom: 0;
width: 100%;
background-color: rgb(173, 67, 230);
color: rgb(107, 218, 243);
text-align: center ;
} 

#liquid {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1; /* keep it behind everything */
  background: linear-gradient(120deg, #2c3e50, #4ca1af);
  filter: blur(50px) brightness(1.3);
  opacity: 0.9;
}


 
  </style>
</head>
<body>



<canvas id="liquid"></canvas>


  <!-- User Profile Modal -->
  <div class="modal fade" id="userProfileModal" >
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content p-3">
        <div class="modal-header">
          <h5 class="modal-title">Profile Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body text-center">
          <div id="profileSpinner" class="spinner-border text-primary mb-3"></div>
          <div id="userDetails" class="user-details d-none"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 🌐 Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="index.html">
        <img src="logo.jpg" alt="Logo" style="width:40px;" class="rounded-pill me-2">
        Thoughts Blog
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a id="thoughtsLink" class="nav-link" href="index.html">Thoughts</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        </ul>
        <div id="navActions" class="d-flex ms-3"></div>
      </div>
      <div id="navActions" class="d-flex ms-3"></div>
    </div>
  </nav>

  <!-- 🌟 Hero Section -->
  <div class="hero">
   
    <h1 class="fw-bold text-primary">Welcome to Thoughts Blog 💭</h1>
    <p class="lead text-secondary">Share your daily thoughts, ideas, and inspirations.</p>
    <button id="exploreBtn" class="btn btn-primary btn-lg mt-3">Explore Thoughts</button>
  </div>

  <div class="footer">
 <p> &copy; 2025 Thoughts Blog 🧿❤️</p>
</div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Your functions.js -->
  <script src="functions.js"></script>

  <!-- Page-specific scripts -->
  <script>
    // Initialize navbar
    document.addEventListener("DOMContentLoaded", () => {
      updateNavbar("navActions");

      // Thoughts / Explore button logic
      const exploreBtn = document.getElementById("exploreBtn");
      exploreBtn.addEventListener("click", () => {
      const user = JSON.parse(localStorage.getItem("loggedInUser"));
      if (user) {
        window.location.href = "thoughts.html";
      } else {
        localStorage.setItem("redirectAfterLogin", "thoughts.html");
        window.location.href = "login.html";
      }
    });



      //This code ensures the navbar “Thoughts” link behaves like the Explore button:
//Logged-in users go directly to thoughts.html.
//Not-logged-in users are sent to login, then back to thoughts.html after login.
//e.preventDefault() is crucial to override default anchor navigation.

      const thoughtsLink = document.getElementById("thoughtsLink");
      thoughtsLink.addEventListener("click", (e) => {
        e.preventDefault();
      const user = JSON.parse(localStorage.getItem("loggedInUser"));
      if (user) {
        window.location.href = "thoughts.html";
      } else {
        localStorage.setItem("redirectAfterLogin", "thoughts.html");
        window.location.href = "login.html";
      }
      });
    });
  </script>


<script src="liquid.js"></script>
</body>
</html>
