<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>💭 Thoughts Blog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #fafafa; }
    .card-img-top { height: 180px; object-fit: cover; }
    .spinner-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 200px;
    }
    .pagination {
      justify-content: center;
      margin-top: 30px;
    }
    .spinner img{
      width: 100%;
      height: 180px;
      object-fit: cover;
    }
</style>
</head>
<body>

  <!-- 🌐 Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary">
        <img src="Screenshot 2025-10-10 145839.png" alt="Logo" style="width:40px;" class="rounded-pill me-2">
        Thoughts Blog
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="thoughts.html">Thoughts</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        </ul>
         <button class="btn btn-outline-primary me-2" data-bs-toggle="modal" data-bs-target="#loginModal">Login</button>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#signupModal">Signup</button>
      </div>
    </div>
  </nav>

  <!-- 🧠 Thoughts Section -->
  <div class="container mt-4">
    <h2 class="text-center mb-4">💭 My Thoughts</h2>

    <!-- Spinner -->
    <div id="spinner" class="spinner-container">
     <div class="spinner-grow" role="status">
  <span class="visually-hidden">Loading...</span>
</div>
    </div>

    <!-- Thoughts list -->
    <div id="thought-section" class="row g-4 d-none"></div>

    <!-- Pagination -->
    <nav>
      <ul id="pagination" class="pagination"></ul>
    </nav>
  </div>

  <footer class="bg-white text-center py-3 mt-5 shadow-sm">© 2025 Thoughts Blog ❤️🧿</footer>


  <!-- Login & Signup Modals -->
  <div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="loginModalLabel">Login</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label">Email address</label>
              <input type="email" class="form-control" id="loginEmail" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" class="form-control" id="loginPassword" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="signupModal" tabindex="-1" aria-labelledby="signupModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="signupModalLabel">Signup</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="signupForm">
            <div class="mb-3">
              <label class="form-label">Name</label>
              <input type="text" class="form-control" id="signupName" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" id="signupEmail" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" class="form-control" id="signupPassword" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Create Account</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="constants.js"></script>

  <script>
    // ✅ Define Base URL for API
   

    const thoughtsContainer = document.getElementById("thought-section");
    const spinner = document.getElementById("spinner");
    const pagination = document.getElementById("pagination");

    let thoughts = [];
    let currentPage = 1;
    const postsPerPage = 9;

    // ✅ Fetch posts using the base URL
    fetch(`${BASE_URL}/posts`)
      .then(res => res.json())
      .then(data => {
        thoughts = data.slice(0, 99); // limit to 100 posts
        spinner.classList.add("d-none");
        thoughtsContainer.classList.remove("d-none");
        showPage(currentPage);
        setupPagination();
      })
      .catch(() => {
        spinner.innerHTML = `<p class="text-danger text-center">⚠️ Failed to load thoughts.</p>`;
      });

    function showPage(page) {
      thoughtsContainer.innerHTML = " ";
      const start = (page - 1) * postsPerPage;
      const end = start + postsPerPage;
      const paginatedPosts = thoughts.slice(start, end);

      paginatedPosts.forEach(thought => {
        const randomImage = `https://picsum.photos/400/200?random=${thought.id}`;
        const card = `
          <div class="col-md-4">
            <div class="card h-100 shadow-sm" style="cursor:pointer;" onclick="openDetail(${thought.id})">
              <img src="${randomImage}" class="card-img-top" alt="Thought image">
              <div class="card-body">
                <h5 class="card-title mt-2 text-capitalize">${thought.title}</h5>
                <p class="card-text text-secondary">${thought.body}</p>
              </div>
            </div>
          </div>`;
        thoughtsContainer.innerHTML += card;
      });
    }

    function setupPagination() {
      const totalPages = Math.ceil(thoughts.length / postsPerPage);
      pagination.innerHTML = "";

      for (let i = 1; i <= totalPages; i++) {
        pagination.innerHTML += `
          <li class="page-item ${i === currentPage ? 'active' : ''}">
            <a class="page-link" href="#" onclick="changePage(${i})">${i}</a>
          </li>`;
      }
    }

    function changePage(page) {
      currentPage = page;
      showPage(currentPage);
      setupPagination();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ✅ Use BASE_URL for navigation — optional for consistency
    function openDetail(id) {
      window.location.href = `thought-detail.html?id=${id}`;
    }

// ✅ Demo login & signup
    document.getElementById('loginForm').addEventListener('submit', function(e){
      e.preventDefault();
      alert('Login successful (demo only)');
      const modal = bootstrap.Modal.getInstance(document.getElementById('loginModal'));
      modal.hide();
    });

    document.getElementById('signupForm').addEventListener('submit', function(e){
      e.preventDefault();
      alert('Account created successfully (demo only)');
      const modal = bootstrap.Modal.getInstance(document.getElementById('signupModal'));
      modal.hide();
    });
</script>
</body>
</html>
