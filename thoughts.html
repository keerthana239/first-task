<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>💭 Thoughts Blog</title>
  <link rel="icon" type="image/png" href="seo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #fafafa; }
    .user-info img { object-fit: cover; }
    .card-img-top { height: 180px; object-fit: cover; }
    .pagination { justify-content: center; margin-top: 30px; }
    .spinner-container { display: flex; justify-content: center; align-items: center; height: 200px; }
  </style>
</head>
<body>
  <!-- 🌐 Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="thoughts.html">
        <img src="logo.jpg" alt="Logo" style="width:40px;" class="rounded-pill me-2">
        Thoughts Blog
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="thoughts.html">Thoughts</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        </ul>
      </div>
      <!-- 👇 Login / Signup or Profile -->
      <div id="navActions" class="d-flex ms-3"></div>
    </div>
  </nav>

  <!-- 🧠 Thoughts Section -->
  <div class="container mt-4">
    <h2 class="text-center mb-4">💭 My Thoughts</h2>
    <div id="spinner" class="spinner-container">
      <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div>
    </div>
    <div id="thought-section" class="row g-4 d-none"></div>
    <nav><ul id="pagination" class="pagination"></ul></nav>
  </div>

  <footer class="bg-white text-center py-3 mt-5 shadow-sm">© 2025 Thoughts Blog ❤️🧿</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="constants.js"></script>
  <script>
    const thoughtsContainer = document.getElementById("thought-section");
    const spinner = document.getElementById("spinner");
    const pagination = document.getElementById("pagination");
    const navActions = document.getElementById("navActions");

    let thoughts = [];
    let currentPage = 1;
    const postsPerPage = 6;

    // 👤 Navbar login/logout setup
    function updateNavbar() {
      const user = JSON.parse(localStorage.getItem("loggedInUser"));
      if (user) {
        navActions.innerHTML = `
          <div class="dropdown">
            <button class="btn btn-outline-primary dropdown-toggle" type="button" data-bs-toggle="dropdown">
              👋 ${user.username}
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item text-danger" href="#" id="logoutBtn">Logout</a></li>
            </ul>
          </div>`;
        document.getElementById("logoutBtn").addEventListener("click", () => {
          localStorage.removeItem("loggedInUser");
           location.href = "thoughts.html";
        });
      } else {
        navActions.innerHTML = `
          <button class="btn btn-outline-primary me-2" onclick="window.location.href='login.html'">Login</button>
          <button class="btn btn-primary" onclick="window.location.href='signup.html'">Signup</button>`;
      }
    }

    updateNavbar();

    // Fetch thoughts
    fetch(`${BASE_URL}/posts`)
      .then(res => res.json())
      .then(data => {
        thoughts = data.slice(0, 30);
        spinner.classList.add("d-none");
        thoughtsContainer.classList.remove("d-none");
        showPage(currentPage);
        setupPagination();
      })
      .catch(() => spinner.innerHTML = `<p class="text-danger text-center">Failed to load thoughts.</p>`);

    function showPage(page) {
      thoughtsContainer.innerHTML = "";
      const start = (page - 1) * postsPerPage;
      const end = start + postsPerPage;
      thoughts.slice(start, end).forEach(thought => {
        thoughtsContainer.innerHTML += `
          <div class="col-md-4">
            <div class="card h-100 shadow-sm" onclick="openDetail(${thought.id})" style="cursor:pointer;">
              <img src="https://picsum.photos/400/200?random=${thought.id}" class="card-img-top" alt="Image">
              <div class="card-body">
                <h5 class="card-title">${thought.title}</h5>
                <p class="card-text text-secondary">${thought.body}</p>
              </div>
            </div>
          </div>`;
      });
    }

    function setupPagination() {
      const totalPages = Math.ceil(thoughts.length / postsPerPage);
      pagination.innerHTML = "";

      pagination.innerHTML += `
        <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
          <a class="page-link" href="#" onclick="changePage(${currentPage - 1})">Prev</a>
        </li>`;

      const maxVisiblePages = 5;
      let startPage = Math.max(1, currentPage - Math.floor(maxVisiblePages / 2));
      let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);
      if (endPage - startPage < maxVisiblePages - 1) {
        startPage = Math.max(1, endPage - maxVisiblePages + 1);
      }

      for (let i = startPage; i <= endPage; i++) {
        pagination.innerHTML += `
          <li class="page-item ${i === currentPage ? 'active' : ''}">
            <a class="page-link" href="#" onclick="changePage(${i})">${i}</a>
          </li>`;
      }

      pagination.innerHTML += `
        <li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
          <a class="page-link" href="#" onclick="changePage(${currentPage + 1})">Next</a>
        </li>`;
    }

    function changePage(page) {
      const totalPages = Math.ceil(thoughts.length / postsPerPage);
      if (page < 1 || page > totalPages) return;
      currentPage = page;
      showPage(page);
      setupPagination();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 🔒 Check login before opening detail
    function openDetail(id) {
      const user = JSON.parse(localStorage.getItem("loggedInUser"));
      if (user) {
        window.location.href = `thought-detail.html?id=${id}`;
      } else {
        localStorage.setItem("redirectAfterLogin", `thought-detail.html?id=${id}`);
        window.location.href = "login.html";
      }
    }
  </script>
</body>
</html>
