<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>💭 Thoughts Blog</title>
  <link rel="icon" type="image/png" href="seo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  

  <style>
    body { background-color: #fafafa; }
    .user-info img { object-fit: cover; }
    .card-img-top { height: 180px; object-fit: cover; }
    .pagination { justify-content: center; margin-top: 30px; }
    .spinner-container { display: flex; justify-content: center; align-items: center; height: 200px; }
    .card-img-wrapper {
      position: relative;
      height: 180px;
      background-color: #f8f9fa;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card-img-spinner {
      position: absolute;  
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
    }
    .card-img-top {
      height: 180px;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .card-img-top.loaded {
      opacity: 1;
    }
    .profile-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      object-fit: cover;
      border: 2px solid #0a0a0b;
    }
    .user-details img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 1rem;
    }
    .user-info-item {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
      align-items: center;
    }
    .user-info-label {
      font-weight: bold;
      min-width: 100px;
    }
    background-color-lavender {
      background-color: #E6E6FA;
    }

  </style>
</head>
<body>
  




  <!-- User Profile Modal -->
  <div class="modal fade" id="userProfileModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Profile Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body text-center">
          <div id="profileSpinner" class="spinner-border text-primary mb-3"></div>
          <div id="userDetails" class="user-details d-none">
            <!-- Content will be dynamically added here -->
          </div>
        </div>
      </div>
    </div>
  </div>

  
  <!-- 🌐 Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
  <div class="container-fluid"> <!-- ✅ use container-fluid for full width -->

    <!-- Brand -->
    <a class="navbar-brand fw-bold text-primary" href="thoughts.html">
      <img src="logo.jpg" alt="Logo" style="width:40px;" class="rounded-pill me-2">
      Thoughts Blog
    </a>

    <!-- 🟡 Right Section (Theme + Actions + Toggler) -->
    <div class="d-flex align-items-center ms-auto">
      <button class="btn-theme-toggle theme-toggle me-2" onclick="themeController.toggleTheme()">
        🔆
      </button>

      <div id="navActions" class="d-flex align-items-center me-2"></div>

      <!-- Navbar toggler always at far right -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
    </div>

    <!-- Collapsible links -->
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link active" href="thoughts.html">Thoughts</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
      </ul>
    </div>

  </div>
</nav>


  <!-- 🧠 Thoughts Section -->
  <div class="container mt-4">
    <h2 class="text-center mb-4">💭 My Thoughts</h2>
    <div id="spinner" class="spinner-container">
      <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div>
    </div>
    <div id="thought-section" class="row g-4 d-none"></div>
    <nav><ul id="pagination" class="pagination"></ul></nav>
  </div>

  <footer class="bg-white  py-3 mt-5 shadow-sm-9  border border-dark text-center ">© 2025 Thoughts Blog ❤️🧿</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="constants.js"></script>
<script src="functions.js"></script>
<script src="profile.js"></script>
<script>
  // Example: fetch thoughts and initialize page
  updateNavbar();


  fetch(`${BASE_URL}/posts`)
    .then(res => res.json())
    .then(data => {
      thoughts = data.slice(0, 30);
      document.getElementById("spinner").classList.add("d-none");
      document.getElementById("thought-section").classList.remove("d-none");
      showPage();
      setupPagination();
    })
    .catch(() => document.getElementById("spinner").innerHTML = `<p class="text-danger text-center">Failed to load thoughts.</p>`);
</script>


<script>
  // 🚫 Redirect non-logged-in users
  const user = JSON.parse(localStorage.getItem("loggedInUser"));
  if (!user) {
    // remember where they tried to go
    localStorage.setItem("redirectAfterLogin", window.location.href);
    // go to login page
    window.location.href = "login.html";
  }

  document.getElementById("logoutBtn").addEventListener("click", () => {
  localStorage.removeItem("loggedInUser");
  window.location.href = "index.html"; // ✅ back to home
});
</script>

<script src="js/theme-controller.js"></script>
<link rel="stylesheet" href="css/theme.css">
</body>
</html>
