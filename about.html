<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>About | Thoughts Blog</title>
  <link rel="icon" type="image/png" href="seo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="prostyle.css" rel="stylesheet">
  <style>
    body { background-color: #fafafa; }
     .footer {
position: fixed;
left: 0;
bottom: 0;
width: 100%;
height:50px;
background-color: rgb(173, 67, 230);
color: rgb(107, 218, 243);
text-align: center ;
} 
  </style>
</head>
<body>
  <!-- 🌐 Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="thoughts.html">
        <img src="logo.jpg" alt="Logo" style="width:40px;" class="rounded-pill me-2">
        Thoughts Blog
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="thoughts.html">Thoughts</a></li>
          <li class="nav-item"><a class="nav-link active fw-semibold text-primary" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        </ul>
      </div>

      <!-- 👇 Profile icon / Login button -->
      <div id="navActions" class="d-flex ms-3"></div>
    </div>
  </nav>

  <!-- 🧠 About Section -->
  <div class="container py-5">
    <h2 class="text-center text-primary fw-bold mb-4">About Us 💡</h2>
    <p class="lead text-center text-secondary">
      <strong>Thoughts Blog</strong> is a place where inspiration meets creativity.<br>
      We share ideas, stories, and lessons that spark positivity and growth.<br>
      Join our community and express your thoughts freely!
    </p>
  </div>

 <div class="footer">
 <p>&copy; 2025 Thoughts Blog 🧿❤️</p>
</div>

  <!-- 📜 Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="profile.js"></script>
  <script src="profile.html"></script>


<!-- Call the function -->
<script>
  updateNavbar();
</script>
<div class="modal fade" id="userProfileModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Profile Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body text-center">
        <div id="profileSpinner" class="spinner-border text-primary mb-3"></div>
        <div id="userDetails" class="user-details d-none"></div>
      </div>
    </div>
  </div>
</div>


  <script>
    // 🚫 Redirect non-logged-in users
    const user = JSON.parse(localStorage.getItem("loggedInUser"));
    if (!user) {
      localStorage.setItem("redirectAfterLogin", window.location.href);
      window.location.href = "login.html";
    }

    // ✅ Initialize navbar with profile icon
    document.addEventListener("DOMContentLoaded", updateNavbar);
    document.addEventListener("DOMContentLoaded", () => {
      updateNavbar("navActions");
    });
    
  </script>
</body>
</html>
