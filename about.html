<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>About | Thoughts Blog</title>
  <link rel="icon" type="image/png" href="seo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="prostyle.css" rel="stylesheet">
  <style>
    body { background-color: #fafafa; }
   


  </style>
</head>
<body>

  


  <!-- 🌐 Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
  <div class="container-fluid"> <!-- ✅ use container-fluid for full width -->

    <!-- Brand -->
    <a class="navbar-brand fw-bold text-primary" href="thoughts.html">
      <img src="logo.jpg" alt="Logo" style="width:40px;" class="rounded-pill me-2">
      Thoughts Blog
    </a>

    <!-- 🟡 Right Section (Theme + Actions + Toggler) -->
    <div class="d-flex align-items-center ms-auto">
      <button class="btn-theme-toggle theme-toggle me-2" onclick="themeController.toggleTheme()">
        🔆
      </button>

      <div id="navActions" class="d-flex align-items-center me-2"></div>

      <!-- Navbar toggler always at far right -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
    </div>

    <!-- Collapsible links -->
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link active" href="thoughts.html">Thoughts</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
      </ul>
    </div>

  </div>
</nav>

  <!-- 🧠 About Section -->
  <div class="container py-5">
    <h2 class="text-center text-primary fw-bold mb-4">About Us 💡</h2>
    <p class="lead text-center text-primary">
      <strong>Thoughts Blog</strong> is a place where inspiration meets creativity.<br>
      We share ideas, stories, and lessons that spark positivity and growth.<br>
      Join our community and express your thoughts freely!
    </p>
  </div>

 <footer class="bg-white  py-3 mt-5 shadow-sm-9  border border-dark text-center fixed-bottom">© 2025 Thoughts Blog ❤️🧿</footer>

  <!-- 📜 Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="profile.js"></script>
  <script src="profile.html"></script>


<!-- Call the function -->
<script>
  updateNavbar();
</script>
<div class="modal fade" id="userProfileModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Profile Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body text-center">
        <div id="profileSpinner" class="spinner-border text-primary mb-3"></div>
        <div id="userDetails" class="user-details d-none"></div>
      </div>
    </div>
  </div>
</div>


  <script>
    // 🚫 Redirect non-logged-in users
    const user = JSON.parse(localStorage.getItem("loggedInUser"));
    if (!user) {
      localStorage.setItem("redirectAfterLogin", window.location.href);
      window.location.href = "login.html";
    }

    // ✅ Initialize navbar with profile icon
    document.addEventListener("DOMContentLoaded", updateNavbar);
    document.addEventListener("DOMContentLoaded", () => {
      updateNavbar("navActions");
    });
    
  </script>


  <script src="js/theme-controller.js"></script>
<link rel="stylesheet" href="css/theme.css">


</body>
</html>
